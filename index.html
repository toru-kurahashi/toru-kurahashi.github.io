<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>My Game Portfolio</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: #0f172a;
      color: white;
    }

    header {
      text-align: center;
      padding: 60px 20px;
      background: linear-gradient(135deg, #1e293b, #0f172a);
    }

    header h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }

    header p {
      color: #94a3b8;
    }

    .games {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      padding: 40px;
    }

    .game {
      background: #1e293b;
      border-radius: 10px;
      overflow: hidden;
      transition: 0.3s;
    }

    .game:hover {
      transform: scale(1.03);
    }

    .game img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .game-content {
      padding: 15px;
    }

    .game-content h2 {
      margin: 0 0 10px;
    }

    .game-content p {
      font-size: 14px;
      color: #cbd5f5;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #94a3b8;
    }
  </style>
</head>

<body>

<header>
  <h1>My Game Portfolio</h1>
  <p>ゲームクリエイター ○○ の作品集</p>
</header>

<section class="games">

  <div class="game">
    <img src="game1.jpg" alt="ゲーム1">
    <div class="game-content">
      <h2>ゲームタイトル1</h2>
      <p>ジャンル：アクション<br>
         使用技術：Unity / C#<br>
         簡単な説明を書く</p>
    </div>
  </div>

  <div class="game">
    <img src="game2.jpg" alt="ゲーム2">
    <div class="game-content">
      <h2>ゲームタイトル2</h2>
      <p>ジャンル：パズル<br>
         使用技術：Unreal Engine<br>
         簡単な説明を書く</p>
    </div>
  </div>

  <div class="game">
    <img src="game3.jpg" alt="ゲーム3">
    <div class="game-content">
      <h2>ゲームタイトル3</h2>
      <p>ジャンル：RPG<br>
         使用技術：JavaScript<br>
         簡単な説明を書く</p>
    </div>
  </div>

</section>

<footer>
  © 2026 くらっと
</footer>

</body>
</html>
